services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - 5432:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app -d app
      interval: 5s
      timeout: 3s
      retries: 10
  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - goose
      - -dir
      - /migrations
      - postgres
      - postgres://app:app@db:5432/app?sslmode=disable
      - up
    restart: "no"
  postgrest:
    image: docker.io/postgrest/postgrest:v12.2.3
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://app:app@db:5432/app
      PGRST_DB_SCHEMA: app
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_LISTEN: 0.0.0.0:3000
      PGRST_LOG_LEVEL: info
    ports:
      - 3000:3000
  api:
    build: .
    depends_on:
      postgrest:
        condition: service_started
    environment:
      POC_POSTGREST_URL: http://postgrest:3000
    ports:
      - 8000:8000
