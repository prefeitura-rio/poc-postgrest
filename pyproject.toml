[project]
name = "poc"
version = "0.1.0"
description = "Postgres + PostgREST + FastAPI proof of concept"
authors = [{ name = "Pedro Mendes", email = "pedrohrmendes@proton.me" }]
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141.1",
  "httpx2>=2.12.0",
  "pydantic-settings>=2.15.0",
  "granian[pname,uvloop]>=1.6.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
